name: Flutter prüfen und bauen
on:
  push:
    branches: [main, codex/initial-logbook]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Plattformen vorbereiten
        run: bash tool/bootstrap.sh
      - name: Statische Analyse
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Firebase live prüfen (temporäre Konten)
        run: node tool/verify-firebase.mjs
      - name: Web bauen
        run: flutter build web --release --no-web-resources-cdn
      - name: Web-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: taxi-logbook-web
          path: build/web
          retention-days: 14
      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android-Testversion bauen
        run: flutter build apk --debug
      - name: Android-Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: taxi-logbook-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
